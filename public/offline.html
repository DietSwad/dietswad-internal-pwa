<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2C1A0A" />
    <title>Offline — Diet Swad Internal</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #F5EDE0;
        color: #2C1A0A;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      img { width: 72px; height: 72px; margin-bottom: 1.5rem; border-radius: 16px; }

        background: #2C1A0A;
        color: #F5EDE0;
        border: none;
        border-radius: 8px;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>

  <body>
    <img src="/icon-192.png" alt="Diet Swad" />

    <p>Check your connection and try again.</p>
